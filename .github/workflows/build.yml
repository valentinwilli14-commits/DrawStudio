
name: Build DrawStudio EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'DrawStudio.html'
      - 'icon.ico'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create app
        run: |
          npm init -y
          npm install electron electron-builder --save-dev
          npm pkg set main=main.js
          npm pkg set scripts.dist="electron-builder --win portable"

      - name: Create icon folder
        run: |
          New-Item -ItemType Directory -Force -Path build
          Copy-Item icon.ico build/icon.ico
        shell: pwsh

      - name: Create Electron files
        shell: pwsh
        run: |
          @'
          const { app, BrowserWindow } = require('electron');
          const path = require('path');

          const APP_ID = 'com.valentin.drawstudio';
          app.setAppUserModelId(APP_ID);

          app.whenReady().then(() => {
            const iconPath = path.join(__dirname, 'build', 'icon.ico');

            const win = new BrowserWindow({
              width: 1400,
              height: 950,
              title: 'DrawStudio',
              icon: iconPath
            });

            win.setAppDetails({
              appId: APP_ID,
              appIconPath: iconPath,
              appIconIndex: 0
            });

            win.loadFile(path.join(__dirname, 'DrawStudio.html'));
          });
          '@ | Set-Content main.js

          @'
          {
            "appId": "com.valentin.drawstudio",
            "productName": "DrawStudio",
            "directories": {
              "output": "dist"
            },
            "files": [
              "main.js",
              "DrawStudio.html",
              "build/icon.ico",
              "package.json",
              "node_modules/**/*"
            ],
            "win": {
              "target": ["portable"],
              "icon": "build/icon.ico",
              "signAndEditExecutable": true
            }
          }
          '@ | Set-Content electron-builder.json

      - name: Build EXE
        run: npm run dist

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DrawStudio-Windows
          path: dist/*.exe
